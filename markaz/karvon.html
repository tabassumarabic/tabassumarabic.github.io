<style>

          --terra:#C8553D; --oasis:#2A9D8F; --saff:#E09A2B; --palm:#5B8C3A; --line:#E2CBA4; }
  * { box-sizing: border-box; }

  /* Katta ekran (host) */

  .h-mid { display: grid; grid-template-rows: auto 1fr; gap: 1.2vh; min-height: 0; }

  .track { display: grid; gap: .9vh; align-content: end; }
  .lane { position: relative; height: 7.4vh; border-radius: 1.4vh; background: rgba(255,255,255,.4); border: .25vh dashed rgba(138,110,82,.4); display: flex; align-items: center; }
  .lane .nm { width: 15vw; padding-left: 1vw; font-size: 2.1vh; font-weight: 900; display: flex; align-items: center; gap: .6vw; overflow: hidden; white-space: nowrap; }
  .lane .nm i { width: 1.6vh; height: 1.6vh; border-radius: 50%; flex: none; }
  .lane .road { position: relative; flex: 1; height: 100%; }
  .lane .cam { position: absolute; bottom: .4vh; width: 8vh; height: 6.4vh; transition: left 1.2s cubic-bezier(.3,.9,.4,1); transform: translateX(-50%); }
  .lane .pts { position: absolute; top: .3vh; transform: translateX(-50%); font-size: 1.8vh; background: var(--cream); border-radius: 999px; padding: 0 .6vw; transition: left 1.2s; white-space: nowrap; }
  .lane .gain { position: absolute; top: 50%; margin: -1.4vh 0 0 5.4vh; font-size: 2.6vh; text-shadow: 0 0 .4vh #fff; font-weight: 900; color: #1f7a3a; transform: translateX(-50%); animation: up 1.8s forwards; }
  @keyframes up { 0%, 60% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(0, -3vh); } }
  .lane .fin { position: absolute; right: 6.5vh; top: .4vh; bottom: .4vh; border-right: .4vh dotted var(--coffee); opacity: .35; }
  .lane .oasis-end { position: absolute; right: .6vh; top: 0; bottom: 0; display: grid; place-items: center; font-size: 4.6vh; }
  .lane .ans { position: absolute; left: .4vw; bottom: .3vh; font-size: 1.5vh; color: var(--mu); }
  .h-foot { display: flex; gap: 1vw; align-items: center; }
  .h-foot .btn { width: auto; padding: 1.3vh 2.2vw; font-size: 2.3vh; }
  .h-foot .hint { color: var(--mu); font-size: 1.8vh; margin-left: auto; }
  .h-center { display: grid; place-items: center; text-align: center; gap: 2vh; }
  .h-center h1 { margin: 0; font-size: 6vh; font-weight: 900; color: var(--coffee2); }
  .h-center .sub { font-size: 2.6vh; color: var(--mu); }
  .lobby-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(22vw, 1fr)); gap: 1.4vh 1.4vw; width: 90vw; }
  .lobby-teams .card { padding: 1.6vh 1.4vw; } .lobby-teams .team-h b { font-size: 2.6vh; } .lobby-teams .mem span { font-size: 1.9vh; }
  .lobby-teams .mem span.on { background: var(--oasis); color: #fff; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 1.4vw; height: 46vh; }
  .podium > div { width: 18vw; border-radius: 1.6vh 1.6vh 0 0; color: #fff; display: grid; justify-items: center; align-content: start; padding-top: 2vh; gap: .6vh; position: relative; animation: rise 1s backwards; }
  .podium .medal { font-size: 7vh; margin-top: -9vh; } .podium .tn { font-size: 2.8vh; font-weight: 900; padding: 0 .6vw; text-align: center; } .podium .sc { font-size: 2.4vh; opacity: .9; }
  .podium .xp { font-size: 2vh; background: rgba(0,0,0,.18); border-radius: 999px; padding: .2vh .8vw; }
  @keyframes rise { from { transform: translateY(40vh); } }
  .winner-banner { font-size: 5.6vh; font-weight: 900; color: var(--coffee2); animation: pop .8s 1.2s backwards; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .confetti { position: fixed; top: -5vh; font-size: 3vh; pointer-events: none; animation: fall linear forwards; z-index: 50; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  /* host sozlash sahifasi (oddiy) */
  .setup { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 14px; }
  .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--coffee2); color: var(--cream); padding: 11px 16px; border-radius: 12px; z-index: 60; font-size: 14px; max-width: 92vw; }
  select.in { padding: 8px 10px; font-size: 14px; width: auto; }

</style>

<script>
(() => {
  "use strict";
  const API = "https://fstmvfroylwyelmaxhzh.supabase.co/rest/v1/rpc/";
  const API_KEY = "sb_publishable_dNWgUrggq3AEbr4Ifu74Cg_8iq3K1Nm";
  const HOST = new URLSearchParams(location.search).has("host");
  const TEST = new URLSearchParams(location.search).has("sinov");
  const B = window.KARVON_BANK || { words: [], numbers: [], colors: [], situations: [], facts: [], finals: [], audio: {} };
  const Q_SEC = 15;
  const ROUNDS = { 1: "📚 So'zlar", 2: "🎧 Tinglash", 3: "💬 Hayotiy vaziyatlar", 4: "🌍 Arab dunyosi", 5: "🐫 Shoh tuya sinovi" };
  const SHAPES = ["▲", "◆", "●", "■"];

  const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const isAr = s => /[؀-ۿ]/.test(s);
  const isEmoji = s => /^\p{Extended_Pictographic}/u.test(s) && !/[A-Za-z0-9]/.test(s);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } } };
  const TOKEN = () => store.get(HOST ? "dod_teacher" : "dod_token");
  function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }
  async function rpc(fn, args) {
    let res;
    try { res = await fetch(API + fn, { method: "POST", headers: { apikey: API_KEY, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) }); }
    catch { throw new Error("NET"); }
    const text = await res.text(), body = text ? JSON.parse(text) : null;
    if (!res.ok) throw new Error((body && body.message) || "NET");
    return body;
  }
  const ERR = { REG_CLOSED: "Ro'yxat yopilgan (dushanba–juma ochiq)", BAD_NAME: "Nom 2–24 harf bo'lsin", GAME_RUNNING: "O'yin ketyapti, keyinroq",
    NO_TEAM: "Siz hali jamoaga kirmagansiz", NO_TEAMS: "Jamoalar yo'q: kamida 4 kishi ro'yxatdan o'tishi kerak", TOO_LATE: "Vaqt tugadi ⏰",
    NET: "Internet bilan aloqa yo'q", AUTH: "Avval Tabassum'ga kiring", TEACHER_AUTH: "Ustoz sifatida kiring" };
  const errText = e => ERR[e.message] || "Xatolik: " + e.message;
  const camelSvg = color => `<svg viewBox="0 0 100 80" fill="${color}"><use href="#camel"/></svg>`;
  const fmtSun = d => { const [y, m, dd] = d.split("-"); return `${+dd}-${["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"][+m - 1]}`; };

  // ---------- Ovoz ----------
  let player = null;
  function play(text) {
    const f = B.audio[text]; if (!f) return;
    try { if (player) player.pause(); player = new Audio("../audio/" + f); player.play().catch(() => toast("🔊 tugmasini bosing")); } catch { /* */ }
  }
  let actx = null;
  function tone(seq) {   // [[chastota, boshlanish, davomiylik]]
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume();
      const n = actx.currentTime;
      seq.forEach(([f, d, dur, v = .16]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, n + d); g.gain.exponentialRampToValueAtTime(v, n + d + .02); g.gain.exponentialRampToValueAtTime(.0001, n + d + dur);
        o.connect(g).connect(actx.destination); o.start(n + d); o.stop(n + d + dur + .05); });
    } catch { /* */ }
  }
  const SFX = {
    ok: () => tone([[880, 0, .12], [1318.5, .09, .25]]), bad: () => tone([[233, 0, .2, .07], [196, .15, .3, .07]]),
    fanfare: () => tone([[523.25, 0, .25], [659.25, .2, .25], [783.99, .4, .25], [1046.5, .6, .7], [783.99, 1.0, .2], [1046.5, 1.2, 1.0]]),
  };
  function confetti(n = 90) {
    const em = ["🎉", "✨", "🎊", "⭐", "🌴", "🐪", "🏆"];
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span"); s.className = "confetti"; s.textContent = em[i % em.length];
      s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 2.5 + Math.random() * 3 + "s"; s.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(s); setTimeout(() => s.remove(), 8000);
    }
  }

  // ---------- Savollar tuzish (ustoz «Yangi o'yin» bosganda) ----------
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // 4 ta variant: to'g'risi + boshqalar (takrorsiz), aralashtiriladi
  const mk = (k, r, t, extra, right, others) => {
    const o = shuffle([right, ...shuffle([...new Set(others.filter(x => x !== right))]).slice(0, 3)]);
    return { k, r, t, ...extra, o, c: o.indexOf(right) };
  };
  // Takrorlanmasin: oxirgi o'yinlarda tushganlari oxiriga suriladi
  const fresh = (list, keyOf, recent) => { const s = shuffle(list); return [...s.filter(x => !recent.has(keyOf(x))), ...s.filter(x => recent.has(keyOf(x)))]; };
  function buildGame(level, recentArr) {
    const L = level === "A1" ? 2 : 1, recent = new Set(recentArr || []), out = [];
    const words = B.words.filter(w => w[4] <= L), same = w => words.filter(x => x[3] === w[3] && x[0] !== w[0]);
    // 1-raund: so'zlar — emoji → arabcha va arabcha → emoji
    fresh(words, w => "w:" + w[0], recent).slice(0, 10).forEach((w, i) => out.push(i % 2 === 0
      ? mk("w:" + w[0], 1, "e2a", { p: "Bu nima? Arabchasini toping", q: w[1] }, w[0], same(w).map(x => x[0]))
      : mk("w:" + w[0], 1, "a2e", { p: "Bu so'z qaysi rasm?", ar: w[0], a: w[0] }, w[1], same(w).map(x => x[1]))));
    // 2-raund: tinglash — so'z, son, rang (A1: va ibora ma'nosi)
    const used = new Set(out.map(q => q.k));
    const lw = fresh(words.filter(w => !used.has("w:" + w[0])), w => "l:" + w[0], recent).slice(0, L === 2 ? 4 : 5);
    lw.forEach(w => out.push(mk("l:" + w[0], 2, "listen", { p: "🎧 Eshiting. Qaysi rasm?", a: w[0] }, w[1], same(w).map(x => x[1]))));
    const nums = B.numbers.filter(n => n[2] <= L);
    fresh(nums, n => "n:" + n[1], recent).slice(0, 3).forEach(n => out.push(mk("n:" + n[1], 2, "listen", { p: "🎧 Eshiting. Qaysi son?", a: n[0] }, String(n[1]),
      shuffle(nums.filter(x => x[1] !== n[1])).sort((a, b) => Math.abs(a[1] - n[1]) - Math.abs(b[1] - n[1])).slice(0, 5).map(x => String(x[1])))));
    fresh(B.colors, c => "c:" + c[0], recent).slice(0, L === 2 ? 1 : 2).forEach(c => out.push(mk("c:" + c[0], 2, "listen", { p: "🎧 Eshiting. Qaysi rang?", a: c[0] }, c[1], B.colors.map(x => x[1]))));
    if (L === 2) fresh(B.situations.filter(s => s.l === 2), s => "sl:" + s.o[0], recent).slice(0, 2)
      .forEach(s => out.push(mk("sl:" + s.o[0], 2, "listen", { p: "🎧 Eshiting. Bu ibora nima degani?", a: s.o[0] }, s.m, B.situations.filter(x => x !== s).map(x => x.m))));
    // 3-raund: hayotiy vaziyatlar (A1: asosan qiyinroqlari)
    const sit = L === 2 ? [...fresh(B.situations.filter(s => s.l === 2 && !out.some(q => q.k === "sl:" + s.o[0])), s => "s:" + s.p, recent).slice(0, 7),
                           ...fresh(B.situations.filter(s => s.l === 1), s => "s:" + s.p, recent).slice(0, 3)]
                        : fresh(B.situations.filter(s => s.l === 1), s => "s:" + s.p, recent).slice(0, 10);
    shuffle(sit).forEach(s => out.push(mk("s:" + s.p, 3, "sit", { p: s.p }, s.o[0], s.o.slice(1))));
    // 4-raund: arab dunyosi — qiziqarli faktlar
    fresh(B.facts, f => "f:" + f.p, recent).slice(0, 10).forEach(f => out.push(mk("f:" + f.p, 4, "fact", { p: f.p }, f.o[0], f.o.slice(1))));
    // Final: 5 ta qiyin savol (tikish bilan)
    const fin = L === 2 ? [...fresh(B.finals.filter(f => f.l === 2), f => "x:" + f.p + f.o[0], recent).slice(0, 4), ...fresh(B.finals.filter(f => f.l === 1), f => "x:" + f.p + f.o[0], recent).slice(0, 1)]
                        : fresh(B.finals.filter(f => f.l === 1), f => "x:" + f.p + f.o[0], recent).slice(0, 5);
    fin.forEach(f => out.push(mk("x:" + f.p + f.o[0], 5, "final", { p: f.p }, f.o[0], f.o.slice(1))));
    return out;
  }

        lane.querySelector(".cam").style.left = pos + "%"; const pt = lane.querySelector(".pts"); pt.style.left = pos + "%"; pt.textContent = s;
        lane.querySelector(".ans").textContent = g.status === "q" ? ((g.answered || []).includes(t.id) ? "✅ javob berdi" : `🧭 ${cap || ""}…`)
          : g.status === "bet" ? ((g.bets || {})[t.id] ? `🎲 ${g.bets[t.id]}% tikdi` : `🧭 ${cap || ""} o'ylamoqda…`) : "";
        // «+ball» faqat bir marta (shu savolning ochilishida) chiqadi
        const gained = g.status === "reveal" && (g.gained || {})[t.id], gk = g.qi + ":" + t.id;
        if (gained && lane.dataset.g !== gk) {
          lane.dataset.g = gk; const sp = document.createElement("span"); sp.className = "gain";
          sp.style.left = pos + "%"; sp.style.color = gained[0] >= 0 ? "#1f7a3a" : "#b4443a"; sp.textContent = (gained[0] > 0 ? "+" : "") + gained[0];
          lane.querySelector(".road").appendChild(sp); setTimeout(() => sp.remove(), 2000);
        }
      }));
      return lanesEl;
    };
    if (g.status === "lobby") {
      if (sig === hSig && document.querySelector(".lobby-teams")) { $(".lobby-teams").outerHTML = lobbyTeams(); return; }
      hSig = sig;
      $("#root").innerHTML = `<div class="stage"><div class="h-top"><span class="round">🐪 Karvon poygasi · ${esc(g.level)}</span><span class="chip">${g.total - 5} savol + 🐫 final</span></div>
        <div class="h-center" style="grid-row: span 2"><h1>Karvonlar yo'lga chiqmoqda! 🐪🐪🐪</h1>
          <div class="sub">Telefoningizda <b>tabassumarabic.github.io/markaz/karvon.html</b> ni oching</div>${lobbyTeams()}</div>
        <div class="h-foot"><button class="btn" id="go">▶ Boshlash</button><button class="btn ghost" id="back" style="width:auto">← Sozlash</button><span class="hint">Probel — keyingi qadam</span></div></div>`;
      $("#go").onclick = () => ctl("next");
      $("#back").onclick = () => { clearTimeout(hostLoopT); document.body.classList.remove("host"); hSig = ""; hostSetup(true); };
      return;
    }
    if (g.status === "done") {
      if (sig === hSig) return; hSig = sig;
      const sorted = teams.slice().sort((a, b) => (sc[b.id] || 0) - (sc[a.id] || 0));
      const order = [sorted[1], sorted[0], sorted[2]].filter(Boolean), H_ = { 0: "44vh", 1: "34vh", 2: "26vh" };
      const placeOf = t => sorted.indexOf(t) + 1;
      $("#root").innerHTML = `<div class="stage"><div class="h-top"><span class="round">🏁 Poyga tugadi!</span></div>
        <div class="h-center" style="grid-row: span 2"><div class="winner-banner">🏆 ${esc(sorted[0] ? sorted[0].name : "")} — g'olib!</div>
          <div class="podium">${order.map(t => { const p = placeOf(t); return `<div style="background:${t.color};height:${H_[p - 1]};animation-delay:${p === 1 ? 0.6 : p === 2 ? 0.3 : 0}s">
            <span class="medal">${["🏆", "🥈", "🥉"][p - 1]}</span><span class="tn">${esc(t.name)}</span><span class="sc">${sc[t.id] || 0} ball</span><span class="xp">+${[1000, 700, 500][p - 1] + 300} XP har biriga</span></div>`; }).join("")}</div>
          <div class="sub">Qatnashgan har bir talabaga +300 XP · g'olib jamoa bir hafta «🏅 Karvon sardori»</div></div>
        <div class="h-foot"><button class="btn ghost" id="back" style="width:auto">← Sozlash</button></div></div>`;
      $("#back").onclick = () => { clearTimeout(hostLoopT); document.body.classList.remove("host"); hSig = ""; hostSetup(true); };
      if (!celebrated) { celebrated = true; setTimeout(() => { confetti(140); SFX.fanfare(); }, 1200); }
      return;
    }
    const q = g.q || {}, reveal = g.status === "reveal", bet = g.status === "bet";
    if (sig !== hSig) {
      hSig = sig;
      const isFinal = q.r === 5, nextLabel = bet ? "Savolni ochish →" : reveal ? (g.qi + 1 >= g.total ? "🏁 Yakunlash" : "Keyingi →") : "Javobni ko'rsatish";
      $("#root").innerHTML = `<div class="stage">
        <div class="h-top"><span class="round">${ROUNDS[q.r] || ""} · ${isFinal ? `${g.qi - g.total + 6}/5` : `${(g.qi % 10) + 1}/10`}</span>
          <span class="chip">${g.qi + 1}/${g.total}</span><span class="chip" id="ansc"></span>${!bet && !reveal ? `<span class="h-timer" id="ht">${Q_SEC}</span>` : ""}</div>
        ${bet ? `<div class="h-q"><span class="p">🐫 <b>Shoh tuya sinovi!</b> Karvonboshilar jamoa ballining 10, 30 yoki 50% ini tikmoqda. To'g'ri javob — tikilgan ball qo'shiladi, xato — kuyadi!</span></div>`
              : `<div class="h-q">${q.a ? `<button class="say" id="hsay">🔊</button>` : ""}${promptHtml(q)}</div>`}
        <div class="h-mid">${bet ? "<div></div>" : `<div class="h-opts">${q.o.map((_, i) => optHtml(q, i, reveal ? (i === q.c ? "good" : "dim") : "")).join("")}</div>`}<div id="lanes"></div></div>
        <div class="h-foot"><button class="btn" id="nx">${nextLabel}</button><span class="hint">Probel — ${nextLabel.toLowerCase()}</span></div></div>`;
      $("#nx").onclick = hostNext;
      const hs = $("#hsay"); if (hs) hs.onclick = () => play(q.a);
      clearInterval(hTick);
      if (!bet && !reveal) { const end = Date.now() + Math.max(0, Q_SEC * 1000 - (g.elapsed || 0)); hTick = setInterval(() => { const l = Math.ceil(Math.max(0, end - Date.now()) / 1000), el = $("#ht"); if (el) el.textContent = l; if (!l) clearInterval(hTick); }, 250); }
      if (reveal) SFX.ok();
    }
    const box = $("#lanes"); if (box) { const el = lanes(); if (el.parentNode !== box) box.appendChild(el); }
    const ac = $("#ansc"); if (ac) ac.textContent = g.status === "q" ? `✋ ${(g.answered || []).length}/${teams.length} jamoa javob berdi` : "";
    function lobbyTeams() {
      return `<div class="lobby-teams">${(g.teams || []).map(t => `<div class="card"><div class="team-h"><span class="dot" style="background:${t.color}">${camelSvg("#fff")}</span><div><b>${esc(t.name)}</b><small>${(g.players || {})[t.id] || 0}/${t.members.length} kirdi</small></div></div>
        <div class="mem">${t.members.map(m => `<span>${esc(m.name)}</span>`).join("")}</div></div>`).join("")}</div>`;
    }
  }

  if (!TOKEN()) { if (HOST) $("#root").innerHTML = `<div class="setup"><div class="card"><h3>Ustoz sifatida kiring</h3><a class="btn" style="text-decoration:none" href="./">Markazga</a></div></div>`; else renderNoLogin(); }
  else if (HOST) hostSetup(); else stuLoop();
})();
</script>
</body>
</html>
