<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabassum — sertifikat</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@600;700&family=Nunito:wght@700;800;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<!-- 🎓 Tabassum sertifikati: sertifikat.html#TB-2026-0001-XXXX
     Bitta sahifa — QR tekshiruvi («✅ Haqiqiy sertifikat») + sertifikatning o'zi + PDF (chop etish → «PDF sifatida saqlash»). -->
<style>
  :root { --sand:#EBD9BC; --cream:#FFF8EC; --coffee:#6B4423; --coffee2:#4A2E17; --gold:#C9962E; --gold2:#E9C877; --mu:#8A6E52; --oasis:#2A9D8F; --palm:#5B8C3A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sand); font-family: Nunito, system-ui, sans-serif; color: var(--coffee2); font-weight: 700; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 14px; }
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar .m { width: 40px; height: 40px; border-radius: 50%; background: var(--coffee); color: var(--cream); display: grid; place-items: center; font-family: Amiri, serif; font-size: 26px; padding-bottom: 6px; border: 2px solid #E09A2B; }
  .bar b { font-size: 19px; font-weight: 900; flex: 1; }
  .ok { background: var(--cream); border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 0 rgba(107,68,35,.2); flex-wrap: wrap; }
  .ok .big { font-size: 40px; } .ok h3 { margin: 0; color: var(--palm); font-size: 20px; font-weight: 900; } .ok p { margin: 2px 0 0; color: var(--mu); font-size: 14px; }
  .ok.bad h3 { color: #b4443a; }
  .rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; width: 100%; }
  .row { display: flex; justify-content: space-between; gap: 10px; background: #F4E8D3; border-radius: 10px; padding: 9px 12px; font-size: 14px; } .row span { color: var(--mu); }
  .btn { background: var(--oasis); color: #fff; font: inherit; font-weight: 900; border: 0; padding: 13px 18px; border-radius: 12px; box-shadow: 0 5px 0 #1d6f65; font-size: 15px; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1d6f65; }
  .hint { color: var(--mu); font-size: 13px; text-align: center; }

  /* Sertifikat: A4 yotiq (990×700), ekranga sig'ishi uchun kichraytiriladi */
  .stage { width: 100%; position: relative; }
  .cert { width: 990px; height: 700px; background: var(--cream); position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; color: var(--coffee2); direction: rtl;
          background-image: radial-gradient(circle at 50% 40%, #fffdf7 0, #FFF8EC 55%, #f6ead4 100%); font-family: Amiri, serif; font-weight: 400; box-shadow: 0 8px 30px rgba(74,46,23,.25); }
  .b1 { position: absolute; inset: 18px; border: 3px solid var(--acc, var(--gold)); border-radius: 6px; }
  .b2 { position: absolute; inset: 28px; border: 1px solid var(--gold2); border-radius: 4px; }
  /* Har daraja — o'z rangidagi qog'oz (--paper) va ramka (--acc) */
  .cert { background-color: var(--paper, var(--cream)); background-image: radial-gradient(circle at 50% 42%, rgba(255,255,255,.62) 0, rgba(255,255,255,.18) 58%, rgba(0,0,0,.04) 100%); }
  .cert .b1 { box-shadow: inset 0 0 0 5px var(--paper, var(--cream)), inset 0 0 0 7px var(--acc, var(--gold)); }
  .cert .name { border-bottom-color: var(--acc, var(--gold2)); }
  .cert .lvl { background: var(--acc, var(--coffee)); }
  .wm { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .wm span { transform: rotate(-18deg); font-family: Nunito, sans-serif; font-weight: 900; font-size: 120px; letter-spacing: .2em; color: rgba(74,46,23,.07); white-space: nowrap; direction: ltr; }
  .embed .wrap { padding: 0; max-width: none; } .embed .wrap > :not(.stage) { display: none !important; } .embed body, body.embed { background: transparent; }
  body.embed .cert { box-shadow: none; }
  .corner { position: absolute; width: 70px; height: 70px; }
  .scene { position: absolute; left: 28px; bottom: 28px; width: 934px; height: 60px; opacity: .45; }
  .in { position: absolute; inset: 34px 60px 160px; display: grid; justify-items: center; align-content: start; text-align: center; }
  .seal { width: 84px; height: 84px; }
  h1 { font-family: 'Reem Kufi', sans-serif; font-size: 62px; margin: 0; color: var(--coffee); line-height: 1.25; font-weight: 700; }
  .sub { font-size: 24px; color: var(--mu); font-weight: 700; }
  .given { margin-top: 8px; font-size: 24px; color: var(--mu); }
  .name { font-size: 58px; font-weight: 700; color: var(--coffee2); padding: 0 40px; border-bottom: 2px solid var(--gold2); min-width: 720px; line-height: 1.5; }
  .latin { font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: var(--mu); direction: ltr; margin-top: 2px; }
  .what { margin-top: 6px; font-size: 25px; line-height: 1.65; max-width: 880px; }
  .what b { color: var(--coffee); font-weight: 700; }
  .lvl { display: inline-block; background: var(--coffee); color: var(--cream); border-radius: 999px; padding: 0 14px; font-family: Nunito, sans-serif; font-weight: 900; font-size: 17px; direction: ltr; line-height: 1.7; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 62px; display: flex; justify-content: space-between; align-items: flex-end; }
  .sig { text-align: center; min-width: 240px; } .sig .line { font-size: 29px; font-weight: 700; color: var(--coffee); border-bottom: 1.5px solid var(--coffee); line-height: 1.5; }
  .sig small { display: block; margin-top: 2px; color: var(--mu); font-size: 17px; }
  .qr { display: grid; justify-items: center; gap: 2px; } .qr .q { background: #fff; padding: 6px; border: 1.5px solid var(--gold2); border-radius: 6px; line-height: 0; }
  .qr small { font-size: 15px; color: var(--mu); } .qr b { font-family: Nunito, sans-serif; font-size: 12.5px; letter-spacing: .06em; direction: ltr; }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; }
    .wrap > :not(.stage) { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    /* 990×700 px dizayn A4 varag'iga (297×210 mm ≈ 1122×794 px) to'liq cho'ziladi */
    .stage { width: 297mm; height: 210mm !important; overflow: hidden; }
    .cert { transform: scale(1.1338) !important; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="camel" viewBox="0 0 100 80"><path d="M18 42C20 37 24 35 28 34 31 22 37 13 45 13 53 13 57 22 59 32 63 37 70 40 76 38 79 34 80 26 84 18 86 14 92 14 95 18L96 22C93 24 90 24 87 24 84 30 82 40 76 48 72 52 68 53 66 54L66 78 63 78 62 56 59 56 58 78 55 78 54 55 37 55 36 78 33 78 32 55 29 55 28 78 25 78 24 54C20 52 18 48 18 40Z"/><path d="M18 40C14 44 13 50 14 56L16 56C16 50 17 46 19 43Z"/></symbol>
  <symbol id="palm" viewBox="0 0 60 90"><path d="M29 88C30 70 31 50 30 30L33 30C35 50 34 70 33 88Z"/><path d="M31 30C22 18 10 16 2 22 12 20 20 24 28 32ZM31 30C40 18 52 16 58 22 48 20 40 24 33 32ZM31 30C28 16 20 6 10 4 18 10 24 18 29 31ZM31 30C34 16 42 6 52 4 44 10 38 18 33 31ZM31 30C24 26 12 30 6 40 14 32 22 30 29 32ZM31 30C38 26 50 30 56 40 48 32 40 30 33 32Z"/></symbol>
  <symbol id="crn" viewBox="0 0 70 70"><path d="M4 66V20C4 10 10 4 20 4H66" fill="none" stroke="#C9962E" stroke-width="3"/><path d="M14 66V28C14 20 20 14 28 14H66" fill="none" stroke="#E9C877" stroke-width="1.5"/><circle cx="14" cy="14" r="5" fill="#C9962E"/></symbol>
</defs></svg>

<div class="wrap">
  <div class="bar"><span class="m">ت</span><b>Tabassum</b><a href="./" style="color:var(--coffee);font-size:14px">Markaz sayti →</a></div>
  <div id="status" class="ok"><span class="big">⏳</span><div><h3 style="color:var(--mu)">Tekshirilmoqda…</h3></div></div>
  <div id="actions" hidden style="display:grid;gap:6px">
    <button class="btn" id="pdf">📥 PDF qilib saqlash / chop etish</button>
    <div class="hint">Ochilgan oynada «Сохранить как PDF» / «Save as PDF» ni tanlang</div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script>
(() => {
  "use strict";
  const API = "https://fstmvfroylwyelmaxhzh.supabase.co/rest/v1/rpc/";
  const API_KEY = "sb_publishable_dNWgUrggq3AEbr4Ifu74Cg_8iq3K1Nm";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Daraja nomlari: o'zbekcha va sertifikat matni uchun arabcha (tushum kelishigida)
  const LEVELS = {
    "Pre-A1": ["Boshlang'ich (A0)", "الْمُسْتَوَى التَّمْهِيدِيَّ"], "A1": ["Boshlovchi", "الْمُسْتَوَى الْمُبْتَدِئَ"],
    "A2": ["Asosiy", "الْمُسْتَوَى الْأَسَاسِيَّ"], "B1": ["O'rta", "الْمُسْتَوَى الْمُتَوَسِّطَ"],
    "B2": ["O'rtadan yuqori", "الْمُسْتَوَى فَوْقَ الْمُتَوَسِّطِ"], "C1": ["Yuqori", "الْمُسْتَوَى الْمُتَقَدِّمَ"], "C2": ["Mukammal", "مُسْتَوَى الْإِتْقَانِ"],
  };
  // Qog'oz rangi va ramka rangi — har daraja uchun alohida
  const PAPER = {
    "Pre-A1": ["#F7D8CA", "#C8553D"], "A1": ["#CDEBE3", "#2A9D8F"], "A2": ["#F9E1B2", "#E09A2B"], "B1": ["#DCEACA", "#5B8C3A"],
    "B2": ["#E4D6F1", "#7a5a9c"], "C1": ["#D3E2F3", "#3c6e9c"], "C2": ["#F6E3A2", "#B8862E"],
  };
  const arNum = n => Number(n).toLocaleString("ar-EG", { useGrouping: false });
  const arDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("ar-EG", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  const uzDate = d => d.split("-").reverse().join(".");

  async function load(code) {
    try {
      const res = await fetch(API + "cert_verify", { method: "POST", headers: { apikey: API_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_code: code }) });
      return await res.json();
    } catch { return { error: "NET" }; }
  }

  function render(c, sample) {
    const f = c.gender === "f", [uzLvl, arLvl] = LEVELS[c.level] || [c.level, c.level];
    const [paper, acc] = PAPER[c.level] || PAPER["Pre-A1"];
    document.documentElement.style.setProperty("--paper", paper); document.documentElement.style.setProperty("--acc", acc);
    $("#status").className = "ok";
    $("#status").innerHTML = `<span class="big">✅</span><div style="flex:1;min-width:200px"><h3>Haqiqiy sertifikat</h3><p>Bu sertifikat «Tabassum» online markazi tomonidan berilgan</p></div>
      <div class="rows">
        <div class="row"><span>Raqam</span>${esc(c.code)}</div><div class="row"><span>Ism</span>${esc(c.name_lat)}</div>
        <div class="row"><span>Daraja</span>CEFR ${esc(c.level)}</div><div class="row"><span>Natija</span>${c.score}%</div>
        <div class="row"><span>Sana</span>${uzDate(c.issued_at)}</div><div class="row"><span>Ustoz</span>Muhammad Ibrohim</div>
      </div>`;
    $("#actions").hidden = false;
    $("#stage").innerHTML = `<div class="cert" id="cert">
      <div class="b1"></div><div class="b2"></div>
      <svg class="corner" style="left:10px;top:10px"><use href="#crn" width="70" height="70"/></svg>
      <svg class="corner" style="right:10px;top:10px;transform:scaleX(-1)"><use href="#crn" width="70" height="70"/></svg>
      <svg class="corner" style="left:10px;bottom:10px;transform:scaleY(-1)"><use href="#crn" width="70" height="70"/></svg>
      <svg class="corner" style="right:10px;bottom:10px;transform:scale(-1,-1)"><use href="#crn" width="70" height="70"/></svg>
      <svg class="scene" viewBox="0 40 930 80" preserveAspectRatio="none">
        <circle cx="120" cy="70" r="42" fill="#F2B84B" opacity=".55"/>
        <path d="M0 80C150 50 300 64 430 80 560 96 700 58 840 66 890 70 915 76 930 80V120H0Z" fill="#E6CFA3"/>
        <path d="M0 100C200 84 380 110 560 100 740 90 850 108 930 100V120H0Z" fill="#DCC08E"/>
        <g fill="#A27A52"><use href="#camel" x="300" y="40" width="50" height="40"/><use href="#camel" x="348" y="44" width="45" height="36"/><use href="#camel" x="392" y="48" width="40" height="32"/></g>
        <g fill="#7f9c62"><use href="#palm" x="600" y="20" width="44" height="66"/><use href="#palm" x="634" y="36" width="34" height="50"/></g>
      </svg>
      <div class="in">
        <svg class="seal" viewBox="0 0 260 260"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9C877"/><stop offset="1" stop-color="#B8862E"/></linearGradient></defs>
          <circle cx="130" cy="130" r="122" fill="#FFF8EC" stroke="url(#g)" stroke-width="6"/><circle cx="130" cy="130" r="110" fill="none" stroke="url(#g)" stroke-width="2"/>
          <text x="130" y="168" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="120" fill="url(#g)">ت</text></svg>
        <h1>شَهَادَةُ إِتْمَامِ مُسْتَوًى</h1>
        <div class="sub">مَرْكَزُ «تَبَسُّم» لِتَعْلِيمِ اللُّغَةِ الْعَرَبِيَّةِ عَنْ بُعْدٍ</div>
        <div class="given">تُمْنَحُ هَذِهِ الشَّهَادَةُ ${f ? "لِلطَّالِبَةِ" : "لِلطَّالِبِ"}</div>
        <div class="name">${esc(c.name_ar)}</div>
        <div class="latin">${esc(c.name_lat)}</div>
        <div class="what">${f ? "لِإِتْمَامِهَا" : "لِإِتْمَامِهِ"} بِنَجَاحٍ <b>${arLvl}</b> <span class="lvl">CEFR ${esc(c.level)}</span><br>${f ? "وَحُصُولِهَا" : "وَحُصُولِهِ"} عَلَى <b>${sample ? "…" : arNum(c.score)}٪</b> فِي الِاخْتِبَارِ النِّهَائِيِّ</div>
      </div>
      ${sample ? `<div class="wm"><span>NAMUNA</span></div>` : ""}
      <div class="foot">
        <div class="sig"><div class="line">${esc(c.teacher_ar)}</div><small>الْمُعَلِّمُ · مُدِيرُ الْمَرْكَزِ</small></div>
        <div class="sig"><div class="line">${arDate(c.issued_at)}</div><small>تَارِيخُ الْمَنْحِ</small></div>
        <div class="qr"><div class="q" id="qr"></div><b>${esc(c.code)}</b><small>تَحَقَّقْ مِنْ صِحَّتِهَا</small></div>
      </div>
    </div>`;
    if (!sample) try {
      const q = qrcode(0, "M"); q.addData(location.origin + location.pathname + "#" + c.code); q.make();
      $("#qr").innerHTML = q.createSvgTag({ cellSize: 2, margin: 0 });
    } catch { /* QR kutubxonasi yuklanmasa ham sertifikat ko'rinadi */ }
    document.title = `Sertifikat ${c.code} — ${c.name_lat}`;
    fit();
  }
  // Ekranga sig'dirish (telefonda kichrayadi, chop etishda asl o'lchamda)
  function fit() {
    const cert = $("#cert"); if (!cert) return;
    const k = Math.min(1, $("#stage").clientWidth / 990);
    cert.style.transform = `scale(${k})`; $("#stage").style.height = 700 * k + "px";
  }
  addEventListener("resize", fit);
  $("#pdf").onclick = () => window.print();

  (async () => {
    const code = decodeURIComponent(location.hash.slice(1)).trim();
    // Ismsiz namuna (galereya rasmlari uchun): sertifikat.html?embed#namuna=A1
    if (location.search.includes("embed")) document.body.classList.add("embed");
    const sm = code.match(/^namuna=(Pre-A1|A1|A2|B1|B2|C1|C2)$/);
    if (sm) {
      render({ code: "TB-2026-0000-XXXX", level: sm[1], score: 0, name_ar: "اِسْمُكَ هُنَا", name_lat: "Ismingiz shu yerda bo'ladi", gender: "m",
               teacher_ar: "مُحَمَّد إِبْرَاهِيم", issued_at: new Date().toISOString().slice(0, 10) }, true);
      $("#status").className = "ok"; $("#status").innerHTML = `<span class="big">👀</span><div><h3 style="color:var(--mu)">Namuna</h3><p>Darajani tugatsangiz, shu sertifikat sizning ismingiz bilan beriladi.</p></div>`;
      $("#actions").hidden = true; document.title = "Sertifikat namunasi — " + sm[1];
      $("#qr").innerHTML = `<div style="width:66px;height:66px;display:grid;place-items:center;font-size:30px">🔒</div>`;
      return;
    }
    if (!code) { $("#status").className = "ok bad"; $("#status").innerHTML = `<span class="big">🔎</span><div><h3>Sertifikat raqami ko'rsatilmagan</h3><p>QR-kodni qayta skanerlang.</p></div>`; return; }
    const c = await load(code);
    if (c && !c.error) return render(c);
    $("#status").className = "ok bad";
    $("#status").innerHTML = c && c.error === "NET"
      ? `<span class="big">📶</span><div><h3 style="color:var(--mu)">Internet yo'q</h3><p>Ulanib, sahifani yangilang.</p></div>`
      : `<span class="big">❌</span><div><h3>Bunday sertifikat topilmadi</h3><p>Raqam: ${esc(code)}. Bu sertifikat «Tabassum» markazi tomonidan berilmagan yoki bekor qilingan.</p></div>`;
  })();
})();
</script>
</body>
</html>
